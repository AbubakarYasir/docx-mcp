[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docx-mcp-server"
version = "0.7.4"
description = "MCP server that typesets books in Microsoft Word — Arabic, Urdu, English and bilingual: RTL, tashkil, footnotes, faharis, Islamic ornament, print-ready and digital PDF — plus track changes, comments and structural validation for any .docx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SecurityRonin" }, { name = "Abu Bakar Gondal" }]
keywords = ["mcp", "model-context-protocol", "docx", "word", "arabic", "urdu", "rtl", "typesetting", "book-design", "tashkil", "hadith", "tahqiq", "islamic-art", "pdf", "print-ready", "track-changes", "comments", "footnotes", "ooxml", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Office/Business :: Office Suites",
    "Natural Language :: Arabic",
    "Natural Language :: Urdu",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=1.0.0",
    "lxml>=4.9.0",
    "mistune>=3.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7,<4",
    "resvg-py>=0.5",
    "shapely>=2.0",
    "pillow>=10",
    "pypdf>=5",
]

[project.optional-dependencies]
equations = ["latex2mathml>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/AbubakarYasir/docx-mcp"
Repository = "https://github.com/AbubakarYasir/docx-mcp"
Documentation = "https://github.com/AbubakarYasir/docx-mcp/blob/main/docs/BOOKS.md"
Changelog = "https://github.com/AbubakarYasir/docx-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/AbubakarYasir/docx-mcp/issues"
Upstream = "https://github.com/SecurityRonin/docx-mcp"

[project.scripts]
docx-mcp = "docx_mcp.cli:main"
docx-mcp-server = "docx_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["docx_mcp"]

# ── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"docx_mcp/document/creation.py" = ["E501"]  # inline XML templates
"docx_mcp/document/typography.py" = ["E501"]  # inline theme XML template
"docx_mcp/document/vectors.py" = ["E501"]  # inline SVG markup
"docx_mcp/document/clausediff.py" = ["E501"]  # long docstring lines
"docx_mcp/server.py" = ["E501"]  # long docstring lines
"tests/conftest.py" = ["E501"]  # inline XML templates
"tests/test_tracks.py" = ["E501"]  # complex assertion expressions
"tests/test_creation.py" = ["E501"]  # complex assertion expressions
"tests/test_table_extensions.py" = ["E501"]  # inline XML templates

# ── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Coverage ────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["docx_mcp"]
omit = ["docx_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]
